<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}DefectDojo{% endblock %}</title>

    <!-- Google Fonts - Refined Minimalist Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Modern CSS - Tailwind -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'dist/css/styles-CQtxVRrk.css' %}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Refined Minimalist Custom Styles -->
    <style>
        :root {
            /* Refined Minimalist Color Palette */
            --color-warm-gray: #F5F5F3;
            --color-muted-sage: #8B9B8E;
            --color-deep-charcoal: #2C2C2C;
            --color-subtle-accent: #B4A7A0;
            --color-off-white: #FAFAF9;
            --color-whisper-gray: #E8E8E6;

            /* Typography */
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Override Tailwind defaults with refined aesthetics */
        body {
            font-family: var(--font-body);
            background-color: var(--color-warm-gray);
            color: var(--color-deep-charcoal);
            letter-spacing: -0.01em;
        }

        body.dark {
            background-color: #1A1A1A;
            color: #F5F5F3;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 3rem;
            line-height: 1.1;
            font-weight: 500;
        }

        h2 {
            font-size: 2rem;
            line-height: 1.2;
        }

        h3 {
            font-size: 1.5rem;
            line-height: 1.3;
        }

        /* Refined card styling */
        .refined-card {
            background: linear-gradient(135deg, #FFFFFF 0%, var(--color-off-white) 100%);
            border: 1px solid var(--color-whisper-gray);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .refined-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.03);
            transform: translateY(-1px);
        }

        body.dark .refined-card {
            background: linear-gradient(135deg, #252525 0%, #2A2A2A 100%);
            border-color: #333333;
        }

        /* Refined transitions */
        * {
            transition-duration: 250ms;
        }

        {% block add_styles %}{% endblock %}
    </style>
</head>

<body class="h-full">
    <!-- Refined Minimalist Navigation -->
    <nav style="background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--color-whisper-gray);" class="sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-8 sm:px-12 lg:px-16">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center space-x-3">
                    <h1 style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 500; color: var(--color-deep-charcoal);">DefectDojo</h1>
                    <span style="font-family: var(--font-body); font-size: 0.75rem; font-weight: 400; color: var(--color-muted-sage); letter-spacing: 0.05em; text-transform: uppercase;">Modern UI Preview</span>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="/dashboard" style="font-family: var(--font-body); font-size: 0.875rem; font-weight: 400; color: var(--color-muted-sage); text-decoration: none; transition: color 250ms;">Classic Dashboard</a>
                    <a href="/dashboard_modern" style="font-family: var(--font-body); font-size: 0.875rem; font-weight: 500; color: var(--color-deep-charcoal); text-decoration: none;">Modern Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content - Dramatic Whitespace -->
    <main class="max-w-7xl mx-auto px-8 sm:px-12 lg:px-16 py-16">
        {% block content %}{% endblock %}
    </main>

    <!-- Modern JS - Alpine.js + Custom -->
    <script type="module" src="{% static 'dist/js/main--lRnQmxy.js' %}"></script>

    <!-- Additional scripts -->
    {% block postscript %}{% endblock %}
</body>
</html>
